sonar.projectKey=arnavbhatiamait_Learn-Github-Actions
sonar.organization=arnavbhatiamait


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Learn-Github-Actions
sonar.projectVersion=1.0

# Coverage Report Path 
sonar.python.coverage.reportPaths=reports/coverage.xml
# Unit test report path
sonar.python.xunit.reportPath=reports/test-results.xml

sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py

sonar.exclusions=**/venv/**,**/bin/**,**/externals/**,**/self-hosted-machine/**,tests/**,**/test_*.py,**/*_test.py

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8