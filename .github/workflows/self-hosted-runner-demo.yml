name: self-hosted-runner-demo
on:
  push:
    branches:
      - dev
jobs:
    demo-1:
        name: Demo Job 1
        runs-on: github-actions-scaleset-demo
             # * This job will run on the self-hosted runner with org level 
        steps:
            - name: Display the System Information
              run: |
                echo "Hostname: $(hostname)"
                echo "Operating System: "
                lsb_release -a || cat /etc/os-release
                echo "Runner Name : ${{ runner.name }}"
                echo "Runner OS : ${{ runner.os }}"
                sleep 30
    demo-2:
        name: Demo Job 2
        runs-on: [self-hosted,linux,x64] # * This job will run on self-hosted runners with the label "self-hosted and all the defined labels"
        steps:
            - name: Display the System Information
              run: |
                echo "Hostname: $(hostname)"
                echo "Operating System: "
                lsb_release -a || cat /etc/os-release
                echo "Runner Name : ${{ runner.name }}"
                echo "Runner OS : ${{ runner.os }}"
                sleep 30
