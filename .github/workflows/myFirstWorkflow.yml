name: myFirstWorkflow

# Trigger workflow on push
on:
  push:
  # schedule:
  #   - cron: "*/5 * * * *"
  # workflow_dispatch:

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest

    steps:
      - name: Running Single Command in job1
        run: |
          pwd
          ls -ltr
          hostname

      - name: Checkout Repository
        uses: actions/checkout@v5.0.0

      - name: Step 3
        run: |
          echo `pwd` >> myFirstWorkflow.txt 
          ls -ltr
          hostname
      - name : upload Single file
        uses: actions/upload-artifact@v3.1.2
        with:
          name: single-file
          path : ./myFirstWorkflow.txt
