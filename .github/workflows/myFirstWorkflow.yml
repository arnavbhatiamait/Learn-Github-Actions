name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on:
  push:
    branches:

      - main
      - dev
  pull_request:
    branches:
      - main
jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      # ! download the repo
      - name: Checkout code
        uses: actions/checkout@v5.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/test-results.xml --cov=./ --cov-report=xml --cov-report=term-missing -v
      - name: Upload test results
        uses: actions/upload-artifact@v5.0.0
        with:
          name: unit-test-results
          path: reports/
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      # 
      # ! this is required to upload the results of codeql analysis to github security tab
    strategy:
      matrix:
        language: ['python']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
      - name: Initialize CodeQL
      # ! code ql is used for static code analysis and to find security vulnerabilities in the code
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name : Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with :
          category: 'security'
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # ! solving sonarqube qualtiy gate check failure by adding SONAR_TOKEN in secrets and then using it here to authenticate with sonarqube server and upload the results of code analysis to sonarqube server
      # ! checks for status of code analysis and if it fails then it will fail the workflow and if it passes then it will pass the workflow
      - name : SonarQube Quality Gate Check
        uses : SonarSource/sonarqube-quality-gate-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}         
