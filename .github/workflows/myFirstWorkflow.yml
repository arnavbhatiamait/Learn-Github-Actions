name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on:
  push:
    branches:

      - main
      - dev
  pull_request:
    branches:
      - main
jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      # ! download the repo
      - name: Checkout code
        uses: actions/checkout@v5.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/test-results.xml --cov=./ --cov-report=xml --cov-report=term-missing -v
      - name: Upload test results
        uses: actions/upload-artifact@v5.0.0
        with:
          name: unit-test-results
          path: reports/
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      # 
      # ! this is required to upload the results of codeql analysis to github security tab
    strategy:
      matrix:
        language: ['python']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
      - name: Initialize CodeQL
      # ! code ql is used for static code analysis and to find security vulnerabilities in the code
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name : Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with :
          category: 'security'
    

        