name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on:
  push:
    branches:
      - dev
      # - 'feature-*'
      - main
  pull_request:
    branches:
      # - dev
      # - 'feature-*'
      - main
env:
  ENV_TYPE: DEV
  APP_USER: arnav
  APP_PORT: 80
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps: 
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 - Checkout
        uses: actions/checkout@v5.0.0
      - name: Step-3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Upload Single file
        uses: actions/upload-artifact@v5.0.0
        with:
          name: single_file
          path: ./myartifact.txt
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps: 
      - name: checking current directory
        run: | 
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: single_file
      - name : Reffering Enviornment variables
        run : |
          echo "[INFO] App user is $APP_USER and app port is $APP_PORT and env type is $ENV_TYPE"
          echo "[INFO] Current directory is `pwd` and listing of files is `ls -ltr`  and hostname is `hostname`"
          echo "[INFO] APP USER is $APP_USER"
          echo "[INFO] APP PORT is $APP_PORT"
          echo "[INFO] ENV TYPE is $ENV_TYPE"
      - name: checking current directory post download
        run: | 
          pwd
          ls -ltr
          # ! making job 2 to fail
      - name : Step for PR demos
        run : exit 0
  