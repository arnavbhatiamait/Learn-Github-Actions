name: my-first-workflow
# Grant permissions required by the called reusable workflow's jobs
permissions:
  contents: read
  actions: read
  security-events: write
  packages: write
# To get a trigger on every push in this repo in any branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  ci-pipeline-jon:
    uses: arnavbhatiamait/ReusableWorkflow/.github/workflows/ci-pipeline.yml@main
    with:
      run_codeql: false
      run_sonarqube: false 

      run_build: true
      run_ghcr_publish: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  deploy-with-kubectl:
    needs: ci-pipeline-jon
    uses: arnavbhatiamait/ReusableWorkflow/.github/workflows/kubernetis_kubectl.yml@main
    with: 
      ENVIRONMENT: STAGING
      NAMESPACE : ${{vars.NAMESPACE}}
      IMAGE_NAME: ghcr.io/arnavbhatiamait/myapp
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
  run-selenium-tests:
    environment: STAGING
    needs: deploy-with-kubectl
    runs-on: self-deployed
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Chrome Browser
        run : |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tests.txt
      - name: Run Selenium Tests
        env:
          APP_BASE_URL: ${{vars.APP_BASE_URL}}
        run: |
          pytest tests/ --html=reports/selenium-report.html --self-contained-html
      - name: Upload Selenium Test Report
        uses: actions/upload-artifact@v3
        with:
          name: selenium-test-report  
          path: reports/selenium-report.html
