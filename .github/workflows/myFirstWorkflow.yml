name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on:
  push:
    branches:
      - dev
      # - 'feature-*'
      - main
  pull_request:
    branches:
      # - dev
      # - 'feature-*'
      - main
env:
  ENV_TYPE: DEV
  APP_USER: arnav
  APP_PORT: 80
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps: 
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 - Checkout
        uses: actions/checkout@v5.0.0
      - name: Step-3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Upload Single file
        uses: actions/upload-artifact@v5.0.0
        with:
          name: single_file
          path: ./myartifact.txt
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps: 
      - name: checking current directory
        run: | 
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: single_file
      - name : Reffering Enviornment variables
        run : |
          echo "[INFO] App user is $APP_USER and app port is $APP_PORT and env type is $ENV_TYPE"
          echo "[INFO] Current directory is `pwd` and listing of files is `ls -ltr`  and hostname is `hostname`"
          echo "[INFO] APP USER is $APP_USER"
          echo "[INFO] APP PORT is $APP_PORT"
          echo "[INFO] ENV TYPE is $ENV_TYPE"
      - name : using Github Secrets
        run : |
          echo "Github token is ${{ secrets.APP_PASSWORD }}"
  job3:
    name: JOB3
    runs-on: ubuntu-latest
    steps: 
      - name : Reffering context or in built variables
        run : |
          echo "[INFO] Triggred by ${{github.event_name}}"
          echo "[INFO] New changes are done by ${{github.actor}} in repo ${{github.repository}} and branch is ${{github.ref}}"
          echo "[INFO] Current step is running on ${{job.check_run_id}}"

  staging:
    name: Staging Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Reffering Environment variables
        run: |
          echo "[INFO] Running deployment on staging environment on Host ${{vars.HOST}} and User is ${{vars.USER}}"
      - name : Reffering Enviornment Secrets
        run : |
          echo "Password is ${{ secrets.PASSWORD }}" 
    environment:
      name: STAGING
    if: github.ref == 'refs/heads/dev' 
  production:
    name: Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Reffering Environment variables
        run: |
          echo "[INFO] Running deployment on production environment on Host ${{vars.HOST}} and User is ${{vars.USER}}"
      - name : Reffering Enviornment Secrets
        run : |
          echo "Password is ${{ secrets.PASSWORD }}" 
    environment:
      name: PRODUCTION
    if: github.ref == 'refs/heads/main'
