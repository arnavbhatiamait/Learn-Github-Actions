name: my-first-workflow
# Grant permissions required by the called reusable workflow's jobs
permissions:
  contents: read
  actions: read
  security-events: write
  packages: write
# To get a trigger on every push in this repo in any branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  ci-pipeline-jon:
    uses: arnavbhatiamait/ReusableWorkflow/.github/workflows/ci-pipeline.yml@main
    with:
      run_codeql: true
      run_sonarqube: true

      run_build: true
      run_ghcr_publish: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  deploy-with-kubectl:
    needs: ci-pipeline-jon
    runs-on: self-hosted
     # * This job will run on the self-hosted runner with org level
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
      - name: Install Kubectl
        run: |
          curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client
      - name: Configure to Kubecongig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          kubectl version
          kubectl get nodes
