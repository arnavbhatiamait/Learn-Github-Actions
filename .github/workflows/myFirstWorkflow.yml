name: myFirstWorkflow

# Trigger workflow on push
on:
  push:
  # schedule:
  #   - cron: "*/5 * * * *"
  # workflow_dispatch:

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest

    steps:
      - name: Running Single Command in job1
        run: |
          pwd
          ls -ltr
          hostname

      - name: Checkout Repository
        uses: actions/checkout@v5.0.0

      - name: Step 3
        run: |
          echo `pwd` >> myFirstWorkflow.txt 
          mkdir -p artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
          hostname
      - name : upload Single file
        uses: actions/upload-artifact@v5.0.0
        with:
          name: single-file
          path : ./myFirstWorkflow.txt
      - name : upload Multiple files
        uses: actions/upload-artifact@v5.0.0
        with:
          name: multiple-files-folder
          path : artifacts/
      - name : upload from multiple paths
        uses: actions/upload-artifact@v5.0.0
        with:
          name: multiple-files-files-n-folder
          path : |
            ./myFirstWorkflow.txt
            artifacts/
      - name : upload from multiple paths with exclusions
        uses: actions/upload-artifact@v5.0.0
        with:
          name: multiple-files-exclusions
          path : |
            ./myFirstWorkflow.txt
            artifacts/
            !**/hostname.txt
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps: 
      - name: checking current directory
        run: | 
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: single-file
      - name: checking current directory post download
        run: | 
          pwd
          ls -ltr